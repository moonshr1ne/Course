{% extends "layout.html" %}
{% block content %}
<h2 class="mb-3">Rating Table</h2>

<table class="table table-dark table-sm w-auto">
  <thead><tr><th>#</th><th>User</th><th>MMR</th><th></th></tr></thead>
  <tbody>
  {% for u in users %}
    <tr>
      <td>{{ loop.index }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.mmr }}</td>
      <td>
        {% if session.get('user') == u.username %}
          <a class="btn btn-primary btn-sm" href="{{ url_for('game_page') }}">Play</a>
        {% endif %}
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>

<hr>
<h6>Sign in</h6>
<form method="post" action="{{ url_for('login') }}" class="w-auto">
  <div class="mb-2">
    <input name="username" class="form-control form-control-sm"
           placeholder="Username" required>
  </div>
  <div class="mb-2">
    <input type="password" name="password" class="form-control form-control-sm"
           placeholder="Password" required>
  </div>
  <button class="btn btn-success btn-sm">Sign in</button>
</form>
{% endblock %}
