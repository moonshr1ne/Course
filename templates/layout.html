<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>League of Stickmans</title>

  <!-- Bootstrap без integrity, чтобы браузер ничего не блокировал -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


  <!-- Небольшая темная тема -->
  <style>
    body        { background:#0e1016; color:#f8f9fa; }
    a, a:hover  { color:#0d6efd; }
    .navbar     { background:#6c757d; }
    .canvas-box { background:#14171f; border:1px solid #505050; }
    #gameCanvas { width:100%; height:70vh; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark px-3">
  <span class="navbar-brand">League of Stickmans</span>

  <a href="{{ url_for('leaderboard') }}" class="btn btn-outline-light btn-sm me-2">
      Leaderboard
    </a>

  {% if session.get('user_id') %}
    <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">
      Logout
    </a>
  {% else %}
    <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm">
      Login
    </a>
  {% endif %}
</nav>

<div class="container my-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
